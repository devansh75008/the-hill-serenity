<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Hill Serenity | Luxury Boutique Sanctuary — Chafi, Nainital</title>
  <meta name="description" content="The Hill Serenity is a luxury boutique sanctuary in Chafi, South Gola Range, Nainital — 12 km from Kainchi Dham. Cream stucco, crimson alpine roofs, bespoke suites and timeless Kumaoni hospitality." />

  <!-- Fonts: Taj-exact stack — Libre Baskerville (serif headings) + Inter (clean body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ths-white':   '#FFFFFF',
            'ths-offwhite':'#FAF8F5',
            'ths-cream':   '#F3EDE3',
            'ths-navy':    '#1C2B3A',
            'ths-navy2':   '#243344',
            'ths-dark':    '#111820',
            'ths-gold':    '#B5922C',
            'ths-gold2':   '#C9A84C',
            'ths-gold3':   '#8A6C1A',
            'ths-muted':   '#7A7268',
            'ths-border':  '#E2DDD6',
          },
          fontFamily: {
            serif:   ['"Libre Baskerville"', 'Georgia', 'serif'],
            display: ['"Cormorant"', 'Georgia', 'serif'],
            sans:    ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Libraries -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
